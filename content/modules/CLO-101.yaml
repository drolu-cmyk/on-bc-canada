module_id: CLO-101
title: "Cloud Foundations: Architecture, Identity, and Resilience"
version: 0.1.0
domain: cloud
description: "Build a durable model of cloud services, boundaries, identity, shared responsibility, and resilience."
outcomes:
  - id: CLO101-O1
    statement: "Explain compute, storage, networking, identity, managed services, regions, availability, and shared responsibility."
    level: explain
    stable: true
  - id: CLO101-O2
    statement: "Compare cloud architecture choices by reliability, security, data location, portability, and cost."
    level: evaluate
    stable: true
  - id: CLO101-O3
    statement: "Design a provider-neutral context and architecture map for a defined workload."
    level: design
    stable: true
evidence:
  - artifact_id: CLO101-A1
    type: diagram
    maps_to_outcomes: ["CLO101-O1","CLO101-O3"]
    rubric_id: CLO101-R1
    required_for_certificate: false
  - artifact_id: CLO101-A2
    type: memo
    maps_to_outcomes: ["CLO101-O2","CLO101-O3"]
    rubric_id: CLO101-R2
    required_for_certificate: false
delivery:
  weeks: 2
  live_sessions: ["cloud_foundations_seminar","architecture_mapping_studio","shared_responsibility_case"]
  independent_work: ["service_context_map","architecture_comparison","cloud_boundary_note"]
  accessibility_path: "Layered architecture diagram with written alternative and equivalent evidence criteria."
change_resilience:
  invariant_concepts: ["service_boundary","shared_responsibility","data_location","portability"]
  replaceable_tools: ["architecture_editor","cloud_documentation","diagram_editor"]
  substitution_test: "Learners represent the workload with a diagram or structured table without a required cloud vendor."
  refresh_triggers: ["service_change","region_change","workload_classification_change"]
standards_map: ["cloud.architecture","cloud.shared_responsibility","security.portability"]
safe_lab:
  allowed_data: ["public_cloud_documentation","synthetic_workload","local_emulator"]
  prohibited_data: ["production_account","private_network_details","real_credentials"]
  stop_conditions: ["unknown_data_location","unbounded_service_dependency","unapproved_account_action"]
