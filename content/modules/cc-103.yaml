module_id: CC-103
title: Computing, Networks, and Cloud Foundations
version: 0.1.0
domain: common_core
description: "Build a practical mental model of compute, networks, APIs, identity, storage, and shared responsibility."
outcomes:
  - id: CC103-O1
    statement: "Explain how compute, storage, networks, APIs, identity, and logs combine into a working service."
    level: explain
    stable: true
  - id: CC103-O2
    statement: "Produce a cloud-aware architecture that identifies trust boundaries, dependencies, availability needs, and ownership."
    level: design
    stable: true
  - id: CC103-O3
    statement: "Distinguish provider responsibility, operator responsibility, and learner responsibility in a hosted environment."
    level: analyze
    stable: true
evidence:
  - artifact_id: CC103-A1
    type: diagram
    maps_to_outcomes: [CC103-O1, CC103-O2]
    rubric_id: CC103-R1
    required_for_certificate: false
  - artifact_id: CC103-A2
    type: memo
    maps_to_outcomes: [CC103-O2, CC103-O3]
    rubric_id: CC103-R2
    required_for_certificate: false
delivery:
  weeks: 2
  live_sessions: [foundations_seminar, architecture_studio, shared_responsibility_case]
  independent_work: [service_map, cloud_architecture, responsibility_matrix]
  accessibility_path: "Architecture table and narrated walkthrough option in addition to visual diagram."
change_resilience:
  invariant_concepts: [compute_network_storage, identity_boundary, shared_responsibility, availability]
  replaceable_tools: [cloud_console, infrastructure_as_code, diagram_editor]
  substitution_test: "A learner must redraw the architecture using a different provider vocabulary without changing the underlying decisions."
  refresh_triggers: [service_deprecation, region_or_residency_change, repeated_access_control_error]
standards_map: [cloud.shared_responsibility, security.identity_boundary, quality.architecture_tradeoffs]
safe_lab:
  allowed_data: [synthetic_service_config, public_architecture_examples]
  prohibited_data: [production_accounts, live_secrets, customer_traffic]
  stop_conditions: [unexpected_billable_resource, unknown_public_exposure]

