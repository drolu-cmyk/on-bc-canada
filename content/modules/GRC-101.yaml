module_id: GRC-101
title: "Cybersecurity GRC Foundations: Risk, Controls, and Assurance"
version: 0.1.0
domain: cybersecurity_grc
description: "Connect governance purpose, risk language, control objectives, assurance, and evidence."
outcomes:
  - id: GRC101-O1
    statement: "Explain the relationship between organizational objectives, assets, threats, risk, controls, and assurance."
    level: explain
    stable: true
  - id: GRC101-O2
    statement: "Classify a scenario by risk owner, control objective, evidence source, and decision authority."
    level: analyze
    stable: true
  - id: GRC101-O3
    statement: "Construct a traceable risk-to-control-to-evidence map for a defined business process."
    level: design
    stable: true
evidence:
  - artifact_id: GRC101-A1
    type: control_matrix
    maps_to_outcomes: ["GRC101-O1","GRC101-O2"]
    rubric_id: GRC101-R1
    required_for_certificate: false
  - artifact_id: GRC101-A2
    type: risk_register
    maps_to_outcomes: ["GRC101-O2","GRC101-O3"]
    rubric_id: GRC101-R2
    required_for_certificate: false
delivery:
  weeks: 2
  live_sessions: ["grc_foundations_seminar","risk_language_studio","control_traceability_case"]
  independent_work: ["governance_context","risk_to_control_map","evidence_source_note"]
  accessibility_path: "Structured control matrix with plain-language definitions and screen-reader-friendly export."
change_resilience:
  invariant_concepts: ["risk_ownership","control_objectives","evidence_traceability","assurance"]
  replaceable_tools: ["spreadsheet","control_library","document_editor"]
  substitution_test: "Learners complete the risk-to-control map with a table when a control library is unavailable."
  refresh_triggers: ["control_framework_change","new_business_process","repeated_risk_language_confusion"]
standards_map: ["security.risk_management","governance.decision_rights","quality.evidence"]
safe_lab:
  allowed_data: ["public_control_framework","synthetic_process","authorized_sample"]
  prohibited_data: ["production_vulnerability_details","private_security_reports","live_target_testing"]
  stop_conditions: ["unknown_risk_owner","unbounded_control_scope","unsafe_testing_request"]
