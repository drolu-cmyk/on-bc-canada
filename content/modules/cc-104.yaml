module_id: CC-104
title: Security, Risk, and Control Thinking
version: 0.1.0
domain: common_core
description: "Translate systems and threats into risk statements, control objectives, and evidence."
outcomes:
  - id: CC104-O1
    statement: "Identify assets, threats, vulnerabilities, impacts, and assumptions in a defined scenario."
    level: analyze
    stable: true
  - id: CC104-O2
    statement: "Create a risk register that distinguishes inherent risk, treatment, residual risk, and acceptance authority."
    level: design
    stable: true
  - id: CC104-O3
    statement: "Map a control objective to plausible implementation evidence and a verification method."
    level: evaluate
    stable: true
evidence:
  - artifact_id: CC104-A1
    type: risk_register
    maps_to_outcomes: [CC104-O1, CC104-O2]
    rubric_id: CC104-R1
    required_for_certificate: false
  - artifact_id: CC104-A2
    type: control_matrix
    maps_to_outcomes: [CC104-O2, CC104-O3]
    rubric_id: CC104-R2
    required_for_certificate: false
delivery:
  weeks: 2
  live_sessions: [risk_seminar, threat_scenario_lab, control_evidence_review]
  independent_work: [threat_scenario, risk_register, control_matrix]
  accessibility_path: "Plain-language risk table with optional oral explanation and accessible export."
change_resilience:
  invariant_concepts: [risk_scenario, control_objective, evidence, residual_risk, acceptance]
  replaceable_tools: [risk_register_template, control_catalog, ticketing_system]
  substitution_test: "A learner must translate the reasoning across two control vocabularies without memorizing product-specific identifiers."
  refresh_triggers: [new_threat_pattern, framework_revision, repeated_evidence_quality_failure]
standards_map: [security.risk_management, governance.control_objectives, assurance.evidence]
safe_lab:
  allowed_data: [synthetic_asset_inventory, public_threat_scenario]
  prohibited_data: [live_targets, credentials, unauthorized_exploit_payloads]
  stop_conditions: [unauthorized_testing, active_system_contact, harmful_output]

