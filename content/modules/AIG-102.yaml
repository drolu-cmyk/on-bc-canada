module_id: AIG-102
title: "AI Governance Dossier: Impact to Assurance"
version: 0.1.0
domain: ai_governance
description: "Defend an AI governance dossier across inventory, impact, requirements, oversight, monitoring, retirement, and assurance."
outcomes:
  - id: AIG102-O1
    statement: "Integrate inventory, classification, impact, requirements, transparency, monitoring, retirement, and assurance."
    level: design
    stable: true
  - id: AIG102-O2
    statement: "Defend human accountability, affected-person protections, evidence limitations, and provider substitutions."
    level: defend
    stable: true
  - id: AIG102-O3
    statement: "Revise the dossier after critique and demonstrate traceability across a changed lifecycle event."
    level: evaluate
    stable: true
evidence:
  - artifact_id: AIG102-A1
    type: portfolio
    maps_to_outcomes: ["AIG102-O1","AIG102-O3"]
    rubric_id: AIG102-R1
    required_for_certificate: false
  - artifact_id: AIG102-A2
    type: oral_defense
    maps_to_outcomes: ["AIG102-O2","AIG102-O3"]
    rubric_id: AIG102-R2
    required_for_certificate: false
delivery:
  weeks: 2
  live_sessions: ["governance_dossier_studio","lifecycle_critique","accountability_defense"]
  independent_work: ["ai_governance_dossier","evidence_review","revised_lifecycle_record"]
  accessibility_path: "Portfolio, written defense, audio defense, or captioned video use the same evidence standard."
change_resilience:
  invariant_concepts: ["lifecycle_traceability","human_accountability","evidence_integrity","affected_persons"]
  replaceable_tools: ["governance_register","document_editor","presentation_tool"]
  substitution_test: "Learners defend the dossier with repository files and structured tables when a governance platform changes."
  refresh_triggers: ["new_system_use","policy_change","incident","provider_change"]
standards_map: ["ai.governance","ai.lifecycle","quality.external_review_evidence"]
safe_lab:
  allowed_data: ["synthetic_ai_system","public_policy_reference","mock_incident"]
  prohibited_data: ["real_person_decision","production_ai_system","private_sensitive_data"]
  stop_conditions: ["missing_human_authorizer","unresolved_high_impact_risk","unsupported_compliance_claim"]
