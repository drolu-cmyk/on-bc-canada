name: Deploy public site to AWS Canada

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-site-deploy.yml"
      - "config/deployment.yaml"
      - "infra/public-site.template.json"
      - "infra/engagement-backend.template.json"
      - "infra/legacy-ca-redirect.template.json"
      - "scripts/deploy_public_site.sh"
      - "scripts/deploy_engagement_backend.sh"
      - "scripts/deploy_legacy_ca_redirects.sh"
      - "scripts/preflight_cloudfront_function.sh"
      - "scripts/validate_deployment.py"
      - "scripts/validate_legacy_redirect.py"
      - "site/**"
      - "schemas/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/public-site-deploy.yml"
      - "config/deployment.yaml"
      - "infra/public-site.template.json"
      - "infra/engagement-backend.template.json"
      - "infra/legacy-ca-redirect.template.json"
      - "scripts/deploy_public_site.sh"
      - "scripts/deploy_engagement_backend.sh"
      - "scripts/deploy_legacy_ca_redirects.sh"
      - "scripts/preflight_cloudfront_function.sh"
      - "scripts/validate_deployment.py"
      - "scripts/validate_legacy_redirect.py"
      - "site/**"
      - "schemas/**"
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_ACCOUNT_ID: "891377012881"
  AWS_REGION: ca-central-1
  CERTIFICATE_REGION: us-east-1
  CANONICAL_DOMAIN: canada.sozorock.com
  CANONICAL_DNS_ZONE: canada.sozorock.com
  STACK_NAME: sozorock-ca-public-site
  PUBLIC_SITE_BUCKET_NAME: ${{ vars.PUBLIC_SITE_BUCKET_NAME || 'sozorock-ca-public-site-891377012881' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      public_deploy_changed: ${{ steps.public_changes.outputs.public_deploy_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: public_changes
        name: Detect public deployment changes
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "public_deploy_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" != "push" ]]; then
            echo "public_deploy_changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
            echo "public_deploy_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only "$base" "${{ github.sha }}" > /tmp/public-site-changes.txt
          if grep -Eq '^(config/deployment\.yaml|infra/(public-site\.template\.json|engagement-backend\.template\.json|legacy-ca-redirect\.template\.json)|scripts/(deploy_public_site\.sh|deploy_engagement_backend\.sh|deploy_legacy_ca_redirects\.sh|preflight_cloudfront_function\.sh|validate_deployment\.py|validate_legacy_redirect\.py)|site/|schemas/)' /tmp/public-site-changes.txt; then
            echo "public_deploy_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "public_deploy_changed=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators and agent runtime
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema -r runtime/requirements-agentic.txt
      - name: Validate specifications
        run: python scripts/validate_specs.py
      - name: Validate public copy
        run: python scripts/validate_public_copy.py
      - name: Validate static site
        run: python scripts/validate_site.py
      - name: Validate deployment
        run: python scripts/validate_deployment.py
      - name: Validate legacy redirects
        run: python scripts/validate_legacy_redirect.py
      - name: Run compiler tests
        run: PYTHONPATH=compiler/src python -m unittest discover -s compiler/tests -v
      - name: Run runtime tests
        run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Check deployment script syntax
        run: |
          bash -n scripts/deploy_public_site.sh
          bash -n scripts/deploy_engagement_backend.sh
          bash -n scripts/deploy_legacy_ca_redirects.sh
          bash -n scripts/preflight_cloudfront_function.sh

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLIC_SITE_DEPLOYMENT_ENABLED == 'true' && vars.CANADA_DOMAIN_MIGRATION_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || needs.validate.outputs.public_deploy_changed == 'true')
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: arn:aws:iam::891377012881:role/SozoRockCanadaPublicSiteDeploy
          aws-region: ca-central-1
          role-session-name: sozorock-ca-${{ github.run_id }}
          allowed-account-ids: "891377012881"
      - name: Verify CloudFront Function permissions
        run: bash scripts/preflight_cloudfront_function.sh
      - name: Deploy and publish
        env:
          AWS_ACCOUNT_ID: "891377012881"
          AWS_REGION: ca-central-1
          CERTIFICATE_REGION: us-east-1
          CANONICAL_DOMAIN: canada.sozorock.com
          CANONICAL_DNS_ZONE: canada.sozorock.com
          STACK_NAME: sozorock-ca-public-site
          PUBLIC_SITE_BUCKET_NAME: ${{ vars.PUBLIC_SITE_BUCKET_NAME || 'sozorock-ca-public-site-891377012881' }}
          ADMIN_EMAIL: "oluview@gmail.com"
          NOTIFICATION_EMAIL: "oluview@gmail.com"
        run: bash scripts/deploy_public_site.sh
