name: Validate automation source

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators and agent runtime
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema -r runtime/requirements-agentic.txt
      - name: Validate contracts and claims
        run: python scripts/validate_specs.py
      - name: Validate public copy
        run: python scripts/validate_public_copy.py
      - name: Validate public information shell
        run: python scripts/validate_site.py
      - name: Validate public deployment contract
        run: python scripts/validate_deployment.py
      - name: Validate runtime observability contract
        run: python scripts/validate_runtime_observability.py
      - name: Check runtime observability deployment script syntax
        run: bash -n scripts/deploy_runtime_observability.sh
      - name: Run deterministic curriculum compiler tests
        run: PYTHONPATH=compiler/src python -m unittest discover -s compiler/tests -v
      - name: Validate graph authority contracts
        run: python -m runtime.run_platform_graph_harness validate
      - name: Validate agent identity and tool contracts
        run: python -m runtime.run_agent_identity_policy validate
      - name: Run runtime and graph tests
        run: python -m unittest discover -s runtime -p 'test_*.py' -v
      - name: Build and validate a release manifest
        run: |
          PYTHONPATH=compiler/src python -m curriculum_compiler.compile \
            --source content/modules \
            --output /tmp/on-bc-canada-generated \
            --program-id applied-ai-training-canada \
            --release-version 0.1.0
          python scripts/validate_release.py \
            /tmp/on-bc-canada-generated/releases/applied-ai-training-canada/0.1.0/release-manifest.json
