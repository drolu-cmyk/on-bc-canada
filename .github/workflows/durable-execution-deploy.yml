name: Deploy durable execution plane to AWS Canada

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validators and runtime dependencies
        run: python -m pip install --disable-pip-version-check pyyaml jsonschema -r runtime/requirements-agentic.txt
      - name: Validate durable execution contract
        run: python scripts/validate_durable_execution.py
      - name: Check deployment script syntax
        run: bash -n scripts/deploy_durable_execution.sh
      - name: Run runtime tests
        run: python -m unittest discover -s runtime -p 'test_*.py' -v

  deploy:
    if: vars.DURABLE_EXECUTION_DEPLOYMENT_ENABLED == 'true' && vars.DURABLE_EXECUTION_DEPLOY_ROLE_ARN != ''
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{ vars.DURABLE_EXECUTION_DEPLOY_ROLE_ARN }}
          aws-region: ca-central-1
          role-session-name: sozorock-ca-durable-${{ github.run_id }}
          allowed-account-ids: "891377012881"
      - name: Deploy durable execution infrastructure
        env:
          AWS_ACCOUNT_ID: "891377012881"
          AWS_REGION: ca-central-1
          DURABLE_EXECUTION_STACK_NAME: sozorock-ca-durable-execution
          DURABLE_EXECUTION_ENVIRONMENT: pilot
          DURABLE_EXECUTION_TABLE_NAME: sozorock-ca-graph-executions
          DURABLE_EXECUTION_ALARM_EMAIL: ${{ vars.DURABLE_EXECUTION_ALARM_EMAIL || '' }}
        run: bash scripts/deploy_durable_execution.sh
