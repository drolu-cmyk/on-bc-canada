deployment:
  deployment_id: public-information-shell
  version: 0.2.1
  status: source_only
  stack_region: ca-central-1
  automation:
    workflow: .github/workflows/public-site-deploy.yml
    authentication: github_oidc
    account_id: "891377012881"
    region: ca-central-1
    trigger: main_push
  public_site:
    source_directory: site
    artifact_directory: dist/public-site
    template: infra/public-site.template.json
    hosting: cloudfront_s3
    canonical_origin: "https://canada.sozorock.com"
    domain_names:
      - canada.sozorock.com
      - sozorock.ca
      - www.sozorock.ca
    canonical_root_domain_name: sozorock.com
    canonical_domain_name: canada.sozorock.com
    canonical_dns_zone_name: canada.sozorock.com
    legacy_domain_names:
      - sozorock.ca
      - www.sozorock.ca
    legacy_redirect_status: 301
    certificate_region: us-east-1
    data_collection: disabled
    external_side_effects: disabled
    allowed_methods:
      - GET
      - HEAD
  learner_services:
    status: disabled
    intake: disabled
    production_data: disabled
    external_side_effects: disabled
    reference_region: ca-central-1
  release_gate:
    automated_checks:
      - validate_specs
      - validate_public_copy
      - validate_site
      - validate_deployment
      - compiler_tests
      - runtime_tests
      - release_manifest
    human_authorization_role: deployment_owner
